<!DOCTYPE html>
<html>
  <head>
    <title>Ruby - M5Stack Basic emulator</title>
    <style>
      body {
        margin: 0;
        background: #d9dadc;
        font-family: system-ui, sans-serif;
      }
      #device {
        position: relative;
        width: 760px;
        margin: 40px auto 0 auto;
        padding: 50px 0 30px 0;
        background: linear-gradient(#3a3b3e, #2a2b2d);
        border-radius: 36px;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35), inset 0 2px 0 rgba(255, 255, 255, 0.08);
      }
      #bezel {
        width: 664px;
        margin: 0 auto;
        padding: 12px;
        background: #0c0c0d;
        border-radius: 10px;
      }
      #display {
        display: block;
        width: calc(DISPLAY_WIDTH * 2px);
        height: calc(DISPLAY_HEIGHT * 2px);
        margin: 0 auto;
        image-rendering: pixelated;
        background: #000;
      }
      #buttons {
        display: flex;
        justify-content: space-around;
        width: 600px;
        margin: 34px auto 0 auto;
      }
      .btn {
        width: 120px;
        height: 34px;
        border: none;
        border-radius: 17px;
        background: linear-gradient(#5b5d61, #45474a);
        box-shadow: 0 3px 0 #1d1e20;
        color: #c9cacd;
        font-size: 18px;
        font-weight: 600;
        cursor: pointer;
      }
      .btn:active {
        transform: translateY(3px);
        box-shadow: none;
      }
      #labels {
        display: flex;
        justify-content: space-around;
        width: 600px;
        margin: 10px auto 0 auto;
        color: #8c8e92;
        font-size: 14px;
      }
      #labels span { width: 120px; text-align: center; }
      #help {
        text-align: center;
        color: #55575b;
        font-size: 15px;
        margin: 18px 0;
      }
      #camera {
        text-align: center;
        color: #55575b;
        font-size: 15px;
        visibility: hidden;
      }
      #camera-select { font-size: 15px; margin-left: 8px; }
    </style>
    <!-- Skips failed missing favicon.ico, we could add one though -->
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
  </head>
  <body>
    <div id="device">
      <div id="bezel">
        <canvas id="display" width="DISPLAY_WIDTH" height="DISPLAY_HEIGHT"></canvas>
      </div>
      <div id="buttons">
        <button class="btn" id="btnA" title="Button A (left arrow)">A</button>
        <button class="btn" id="btnB" title="Button B (Enter)">B</button>
        <button class="btn" id="btnC" title="Button C (right arrow)">C</button>
      </div>
      <div id="labels"><span>previous</span><span>select</span><span>next</span></div>
    </div>
    <p id="help">Keyboard: &larr; / &uarr; = A, Enter = B, &rarr; / &darr; = C. Mouse wheel over the screen = A / C.</p>
    <p id="camera">QR camera (emulator only, the M5Stack Basic has no camera):<select id="camera-select" name="camera-select"></select></p>
    <script>
(function() {
      /* Same websocket protocol as display.html:
         1 = previous (button A), 3 = next (button C), 4 = select (button B, front button),
         0 = request a full frame, 12 = camera frame chunk. */
      window.localStream = null;
      function sc(ws, code) {
          var a = new ArrayBuffer(1);
          var v = new Uint8Array(a);
          v[0] = code;
          ws.send(v.buffer);
      }
      function sd(ws) {
          console.log("Connection opened");
          document.getElementById("btnA").addEventListener('click', function() { sc(ws, 1); }, false);
          document.getElementById("btnB").addEventListener('click', function() { sc(ws, 4); }, false);
          document.getElementById("btnC").addEventListener('click', function() { sc(ws, 3); }, false);
          var canvas = document.getElementById('display');
          canvas.onwheel = function(e) {
              if (e.deltaY > 0 ) {
                  e.preventDefault();
                  sc(ws, 1);
              } else if (e.deltaY < 0) {
                  e.preventDefault();
                  sc(ws, 3);
              }
          };
          document.getElementById("camera").style.visibility = "visible";
          sc(ws, 0);
      }
      var canvas = document.getElementById('display');
      var scale = 2;
      var old_x = 0;
      var old_y = 0;

      canvas.onmousemove = function(e) {
          let rect = canvas.getBoundingClientRect();
          let x = Math.trunc((e.clientX - rect.x) / scale);
          let y = Math.trunc((e.clientY - rect.y) / scale);
          if (x === old_x && y === old_y) {
              return;
          }
          canvas.title = "X = " + x + ", Y = " + y;
          old_x = x;
          old_y = y;
      };
      document.addEventListener('keydown', function(e) {
          if (e.code === 'ArrowLeft' || e.code === 'ArrowUp') {
              e.preventDefault();
              sc(ws, 1);
          }
          if (e.code === 'ArrowRight' || e.code === 'ArrowDown') {
              e.preventDefault();
              sc(ws, 3);
          }
          if (e.code === 'Enter' || e.code === 'NumpadEnter') {
              e.preventDefault();
              sc(ws, 4);
          }
      });

      var ctx = canvas.getContext('2d',  {alpha: false});
      console.log('Opening connection');
      const location = window.location;
      const protocol = location.protocol === 'http:' ? 'ws://' : 'wss://';
      const host = location.host;
      const path = location.pathname.substring(0, location.pathname.lastIndexOf('/'));
      const url = protocol + host + path + "/ws";
      var ws = new WebSocket(url);
      ws.binaryType = 'arraybuffer';
      ws.onopen = (e) => {sd(ws);};
      ws.addEventListener('close', (event) => {
          console.log("Disconnected");
      });

      var video_canvas = document.createElement('canvas');
      video_canvas.width = 320;
      video_canvas.height = 240;

      var video_ctx = video_canvas.getContext('2d', {willReadFrequently: true});
      video_ctx.filter = 'grayscale(100%)';
      video_ctx.translate(160, 120);
      video_ctx.rotate(270 * Math.PI / 180);

      var video = null;
      var a = new ArrayBuffer(1 + 320 * 240);
      var v = new Uint8Array(a);
      function update_video() {
         video_ctx.drawImage(video, -120, -160);

         var imgData = video_ctx.getImageData(0, 0, video_canvas.width, video_canvas.height);
         v[0] = 12;
         /* only send 1 byte per pixel / grayscale */
         for (var i = 0, counter = 1; i < imgData.data.length; i += 4) {
             v[counter] = (imgData.data[i] + imgData.data[i + 1] + imgData.data[i + 2]) / 3;
             ++counter;
         }
         /* send off in chuncks of 16k including first "command" byte */
         var chunkSize = 16383;
         var offset = 1
         while (offset < v.length) {
             const end = Math.min(offset + chunkSize, v.length);
             var chunk = new Uint8Array(end - offset + 1);
             chunk[0] = 12;
             chunk.set(new Uint8Array(v.buffer, offset, end - offset), 1);
             ws.send(chunk.buffer);
             offset = end;
         }
      }

      var video_frame_byte_counter = 0;
      var imageData = ctx.createImageData(DISPLAY_WIDTH, DISPLAY_HEIGHT);
      ws.addEventListener('message', (e) => {
          if (e.data instanceof ArrayBuffer) {
              var dataview = new Uint8Array(e.data);
              switch(dataview[0]) {
                  case 0:
                      /* update display event: drop the frame byte, then RGB565 big endian pixels */
                      dataview = dataview.slice(1);
                      for (let i = 0, k = 0; i < dataview.length; i += 2, ++k) {
                          const rgb565 = dataview[i + 1] | (dataview[i] << 8);
                          const r5 = (rgb565 >> 11) & 0x1F;
                          const g6 = (rgb565 >> 5) & 0x3F;
                          const b5 = rgb565 & 0x1F;
                          imageData.data[video_frame_byte_counter + k * 4] = (r5 << 3) | (r5 >> 2);
                          imageData.data[video_frame_byte_counter + k * 4 + 1] = (g6 << 2) | (g6 >> 4);
                          imageData.data[video_frame_byte_counter + k * 4 + 2] = (b5 << 3) | (b5 >> 2);
                          imageData.data[video_frame_byte_counter + k * 4 + 3] = 255;
                      }
                      video_frame_byte_counter += dataview.length * 2;

                      if (video_frame_byte_counter == DISPLAY_WIDTH * DISPLAY_HEIGHT * 4) {
                          ctx.putImageData(imageData, 0, 0);
                          video_frame_byte_counter = 0;
                      } else if (video_frame_byte_counter > DISPLAY_WIDTH * DISPLAY_HEIGHT * 4) {
                          video_frame_byte_counter = 0;
                      }
                      break;
                  case 1:
                      /* get video frame event */
                      if (window.localStream) {
                          update_video();
                          break;
                      }
                      let cameraselect = document.querySelector('#camera-select');
                      let constraints = {
                          video: { deviceId: cameraselect.value ? { exact: cameraselect.value } : undefined,
                                   width: 240,
                                   height: 320,
                                 }
                      };
                      navigator.mediaDevices.getUserMedia(constraints)
                      .then(function(stream) {
                          video = document.createElement('video');
                          video.srcObject = stream;
                          video.onloadedmetadata = function(e) {
                              if (!window.localStream) {
                                  video.play();
                                  window.localStream = stream;
                              }
                              update_video();
                          };
                      })
                      .catch(function(err) {
                          console.log("An error occurred: " + err);
                      });
                      break;
                  case 2:
                      /* stop get video frame event */
                      if (window.localStream) {
                          window.localStream.getTracks().forEach(function(track) { track.stop(); });
                          window.localStream = null;
                          video = null;
                      }
                      break;
                  default:
                      console.log("Unrecognized message from Ruby");
              }
          } else {
              console.log("Unrecognized message from Ruby");
          }
      });
      if (navigator.mediaDevices && navigator.mediaDevices.enumerateDevices) {
        navigator.mediaDevices.enumerateDevices().then(devices => {
          let select = document.querySelector('#camera-select');
          select.addEventListener("change", function() {
            localStorage.setItem("selectedCamera", this.value);
          });
          devices.filter(device => device.kind === 'videoinput').forEach(camera => {
            let option = document.createElement('option');
            option.text = camera.label;
            option.value = camera.deviceId;
            select.appendChild(option);
          });
          let selectedCamera = localStorage.getItem("selectedCamera");
          if (selectedCamera) {
              select.value = selectedCamera;
          }
        });
      }
})();
    </script>
  </body>
</html>
