name: Fuzz
# Host fuzzers of fuzz/ (see fuzz/README.md): 60 s per target on every push, 30 min per
# target every night. The corpus is kept between runs in the Actions cache (not public).
# Crash inputs and sanitizer reports are NOT uploaded or printed (public repo): a failing
# run names the target and the libFuzzer seed only; reproduce locally.
on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: 'Seconds per target'
        default: '600'

jobs:
  host-fuzzers:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
    - name: Checkout repo
      uses: actions/checkout@v5
      with:
        submodules: 'recursive'
    - name: Install clang
      run: sudo apt-get update && sudo apt-get install -y clang make python3 git libmbedtls-dev
    - name: Restore corpus
      uses: actions/cache@v4
      with:
        path: fuzz/out/corpus
        key: fuzz-corpus-${{ github.run_id }}
        restore-keys: fuzz-corpus-
    - name: Fuzz
      env:
        CI: 'true'
        SECONDS_PER_TARGET: ${{ github.event_name == 'schedule' && '1800' || inputs.seconds || '60' }}
      run: sh fuzz/run.sh "$SECONDS_PER_TARGET"
